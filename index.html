<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b4aaa3">
<meta name="description" content="Six gardens from around the world, each showing its real current weather and light.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=Inter:opsz@14&display=optional" rel="stylesheet">
<title>Ritu — by Anwar Creative Studio</title>
<style>
  :root{
    --paper: #b4aaa3;
    --ink: #2c2824;
    --ink-soft: #6b625a;
    --content-font: "Fraunces", "Iowan Old Style", Georgia, serif;
    --ui-font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    --mono-font: ui-monospace, "SF Mono", Menlo, monospace;
    --b: 1;      /* live brightness */
    --s: 1;      /* live saturation */
    --cx: 50%;
    --cy: 50%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 72px;
    color: var(--ink);
    font-family: var(--ui-font);
    background: var(--paper);
    transition: background-color 1.4s ease, color 1.4s ease;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0.4;
    mix-blend-mode: multiply;
    background-image: radial-gradient(rgba(0,0,0,0.03) 0.6px, transparent 0.6px);
    background-size: 3px 3px;
    z-index: 0;
  }
  body > * { position: relative; z-index: 1; }

  .brand {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 6px;
    transition: color 1.4s ease;
  }
  .brand .by {
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    text-transform: none;
    font-weight: 500;
    font-size: 10.5px;
  }
  .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 22px 0 8px;
    transition: color 1.4s ease;
  }
  h1 {
    font-family: var(--content-font);
    font-weight: 500;
    font-size: clamp(24px, 3.8vw, 34px);
    margin: 0 0 8px;
    text-align: center;
    max-width: 560px;
    transition: color 1.4s ease;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    max-width: 460px;
    margin: 0 0 16px;
    font-style: italic;
    line-height: 1.55;
    transition: color 1.4s ease;
  }

  .live-line {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--mono-font);
    font-size: 11.5px;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    margin-bottom: 30px;
    min-height: 16px;
    opacity: 0;
    transition: color 1.4s ease, opacity 0.6s ease;
  }
  .live-line.ready { opacity: 0.9; }
  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.55;
    animation: pulse 2.6s ease-in-out infinite;
    flex: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.85); }
    50% { opacity: 0.85; transform: scale(1); }
  }

  .switcher {
    display: flex;
    align-items: stretch;
    gap: 6px;
    margin-bottom: 38px;
    max-width: 100%;
    overflow-x: auto;
    padding: 4px;
  }
  .switcher::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: var(--ui-font);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
    padding: 8px 14px 7px;
    border-radius: 14px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .tab.active {
    background: color-mix(in srgb, var(--ink) 10%, transparent);
    color: var(--ink);
    font-weight: 600;
  }
  .tab-time {
    font-family: var(--mono-font);
    font-size: 9.5px;
    letter-spacing: 0.02em;
    opacity: 0.62;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .tab-time svg { width: 9px; height: 9px; opacity: 0.85; }

  .stage {
    position: relative;
    width: 100%;
    max-width: 900px;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.5s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1);
  }
  .stage.transitioning { opacity: 0; transform: translateY(10px); }

  .photo-wrap {
    position: relative;
    z-index: 2;
    -webkit-mask-image: radial-gradient(ellipse 62% 62% at var(--cx) var(--cy), black 55%, transparent 90%);
    mask-image: radial-gradient(ellipse 62% 62% at var(--cx) var(--cy), black 55%, transparent 90%);
  }
  .photo {
    width: 100%;
    display: block;
    filter: saturate(calc(1.08 * var(--s))) contrast(1.04) brightness(calc(1.01 * var(--b)));
    transition: filter 2.2s ease;
  }
  .weather-tint {
    position: absolute;
    inset: 0;
    background: var(--tint-color, transparent);
    opacity: var(--tint-opacity, 0);
    mix-blend-mode: var(--tint-blend, normal);
    transition: opacity 2.2s ease, background-color 2.2s ease;
    pointer-events: none;
  }
  .weather-fog {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 60%, rgba(255,255,255,0.55), transparent 75%);
    opacity: 0;
    filter: blur(4px);
    transition: opacity 1.8s ease;
    pointer-events: none;
  }
  .weather-fog.active { opacity: 0.55; }
  .weather-rain {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
  }
  .weather-rain.active { opacity: 1; }
  .drop {
    position: absolute;
    top: -10%;
    width: 1.6px;
    height: 9%;
    background: linear-gradient(to bottom, transparent, rgba(220,232,250,0.85));
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { top: 130%; }
  }
  .weather-snow {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0;
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  .weather-snow.active { opacity: 1; }
  .flake {
    position: absolute;
    top: -6%;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    animation: drift linear infinite;
  }
  @keyframes drift {
    to { top: 116%; transform: translateX(var(--dx, 0)); }
  }

  .seam-shadow {
    position: absolute;
    left: 8%;
    right: 8%;
    height: 54px;
    bottom: 0;
    background: radial-gradient(ellipse 55% 100% at 50% 0%, rgba(0,0,0,0.14), transparent 75%);
    filter: blur(6px);
    z-index: 1;
    pointer-events: none;
    transition: opacity 1.4s ease;
  }

  .footer {
    margin-top: 44px;
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    transition: color 1.4s ease;
  }
</style>
</head>
<body>
  <div class="brand">Ritu <span class="by">— by Anwar Creative Studio</span></div>
  <div class="eyebrow" id="eyebrow">日本 · Japan</div>
  <h1 id="title">A circle raked in sand</h1>
  <p class="sub" id="subtitle">Water finds the stone, and the garden listens.</p>
  <div class="live-line" id="liveLine">
    <span class="live-dot"></span>
    <span id="liveText">reading the sky over Kyoto…</span>
  </div>

  <div class="switcher" id="switcher"></div>

  <div class="stage" id="stage">
    <div class="photo-wrap">
      <img class="photo" id="photo" alt="">
      <div class="weather-tint" id="weatherTint"></div>
      <div class="weather-fog" id="weatherFog"></div>
      <div class="weather-rain" id="weatherRain"></div>
      <div class="weather-snow" id="weatherSnow"></div>
    </div>
    <div class="seam-shadow"></div>
  </div>

  <div class="footer">Ritu — a project by Anwar Creative Studio</div>

<script>
  const SCENES = [
    {
      key: 'japan', label: '日本 · Japan', city: 'Kyoto',
      title: 'A circle raked in sand',
      subtitle: 'Water finds the stone, and the garden listens.',
      src: 'processed-images/japan.png',
      cx: 34.0, cy: 65.3,
      paper: '#b4aaa3', ink: '#2c2824', inkSoft: '#6b625a',
      lat: 35.0116, lon: 135.7681, tz: 'Asia/Tokyo',
    },
    {
      key: 'iran', label: 'ایران · Iran', city: 'Isfahan',
      title: 'A channel drawn straight to the horizon',
      subtitle: 'The chahar bagh: four quarters, one line of water between them.',
      src: 'processed-images/iran.png',
      cx: 39.2, cy: 66.1,
      paper: '#e3c39f', ink: '#3a2c1c', inkSoft: '#7a6650',
      lat: 32.6546, lon: 51.6680, tz: 'Asia/Tehran',
    },
    {
      key: 'mughal-india', label: 'भारत · Mughal India', city: 'Agra',
      title: 'An arch that mirrors itself in still water',
      subtitle: 'Marble carved thin enough for flowers to show through.',
      src: 'processed-images/mughal-india.png',
      cx: 50.0, cy: 50.0,
      paper: '#f5e4cc', ink: '#3a3020', inkSoft: '#7d715a',
      lat: 27.1767, lon: 78.0081, tz: 'Asia/Kolkata',
    },
    {
      key: 'england', label: 'England', city: 'the Cotswolds',
      title: 'Roses climbing a fence gone soft with age',
      subtitle: 'Foxglove, rose, and ivy, tangled the way no one planned.',
      src: 'processed-images/england.png',
      cx: 46.4, cy: 42.9,
      paper: '#9fa17d', ink: '#2a2c1f', inkSoft: '#5f624a',
      lat: 51.8330, lon: -1.8433, tz: 'Europe/London',
    },
    {
      key: 'mexico', label: 'México', city: 'Puebla',
      title: 'Talavera tile, and bougainvillea on both sides',
      subtitle: 'Water finds the shell-carved spout, and keeps its own time.',
      src: 'processed-images/mexico.png',
      cx: 50.0, cy: 50.0,
      paper: '#d16841', ink: '#3a1f14', inkSoft: '#7d5643',
      lat: 19.0414, lon: -98.2063, tz: 'America/Mexico_City',
    },
    {
      key: 'bali', label: 'Bali', city: 'Ubud',
      title: 'A split gate, standing open for no one',
      subtitle: 'Candi bentar: the mountain cut in two so the sacred can pass between.',
      src: 'processed-images/bali.png',
      cx: 43.1, cy: 61.8,
      paper: '#585a2f', ink: '#eee9db', inkSoft: '#c3bfa9',
      lat: -8.5069, lon: 115.2625, tz: 'Asia/Makassar',
    },
  ];

  const NIGHT_INK = '#f1ece2', NIGHT_INK_SOFT = '#b9b2a4';

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex([r, g, b]) {
    return '#' + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
  }
  function lerpHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex(A.map((v, i) => v + (B[i] - v) * t));
  }

  function weatherKind(code) {
    if (code === 0) return 'clear';
    if (code <= 3) return 'cloudy';
    if (code === 45 || code === 48) return 'fog';
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
    if (code >= 95) return 'storm';
    return 'clear';
  }
  function weatherPhrase(kind, isDay, cloudPct) {
    if (kind === 'clear') return isDay ? 'clear and bright' : 'clear, under stars';
    if (kind === 'cloudy') return cloudPct > 70 ? 'grey and overcast' : 'a few clouds passing';
    if (kind === 'fog') return 'wrapped in fog';
    if (kind === 'rain') return 'rain falling';
    if (kind === 'snow') return 'snow falling';
    if (kind === 'storm') return 'a storm rolling through';
    return '';
  }
  function isoLocalToUTCms(str, utcOffsetSeconds) {
    return Date.parse(str + 'Z') - utcOffsetSeconds * 1000;
  }
  function lightPhase(nowMs, sunriseMs, sunsetMs) {
    const golden = 40 * 60 * 1000;
    if (nowMs < sunriseMs - golden || nowMs > sunsetMs + golden) return 'night';
    if (Math.abs(nowMs - sunriseMs) <= golden) return 'dawn';
    if (Math.abs(nowMs - sunsetMs) <= golden) return 'dusk';
    return 'day';
  }

  const root = document.documentElement;
  const eyebrowEl = document.getElementById('eyebrow');
  const titleEl = document.getElementById('title');
  const subtitleEl = document.getElementById('subtitle');
  const stageEl = document.getElementById('stage');
  const imgEl = document.getElementById('photo');
  const switcherEl = document.getElementById('switcher');
  const liveLineEl = document.getElementById('liveLine');
  const liveTextEl = document.getElementById('liveText');
  const tintEl = document.getElementById('weatherTint');
  const fogEl = document.getElementById('weatherFog');
  const rainEl = document.getElementById('weatherRain');
  const snowEl = document.getElementById('weatherSnow');

  // rain/snow particles are created once and just toggled visible per scene
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'drop';
    d.style.left = Math.random() * 100 + '%';
    d.style.animationDuration = (0.5 + Math.random() * 0.4) + 's';
    d.style.animationDelay = (Math.random() * 1) + 's';
    rainEl.appendChild(d);
  }
  for (let i = 0; i < 26; i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    f.style.left = Math.random() * 100 + '%';
    f.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
    f.style.animationDuration = (5 + Math.random() * 4) + 's';
    f.style.animationDelay = (Math.random() * 5) + 's';
    snowEl.appendChild(f);
  }

  let sceneIndex = 0;
  const tabTimeEls = [];
  const tabIconEls = [];

  function closeGap(el) {
    const canvas = document.createElement('canvas');
    canvas.width = el.naturalWidth;
    canvas.height = el.naturalHeight;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(el, 0, 0);
    const bg = ctx.getImageData(3, 3, 1, 1).data;
    const isBg = (px) => Math.abs(px[0]-bg[0])<12 && Math.abs(px[1]-bg[1])<12 && Math.abs(px[2]-bg[2])<12;
    let contentBottom = canvas.height;
    for (let y = canvas.height - 1; y >= 0; y -= 2) {
      const row = ctx.getImageData(0, y, canvas.width, 1).data;
      let has = false;
      for (let x = 0; x < canvas.width; x += 6) {
        const px = [row[x*4], row[x*4+1], row[x*4+2]];
        if (!isBg(px)) { has = true; break; }
      }
      if (has) { contentBottom = y; break; }
    }
    const bufferRatio = 0.01;
    const keepRatio = Math.min(1, (contentBottom / canvas.height) + bufferRatio);
    const displayedHeight = el.getBoundingClientRect().height;
    const clipPx = displayedHeight * (1 - keepRatio);
    el.style.clipPath = `inset(0 0 ${clipPx.toFixed(1)}px 0)`;
    el.style.marginBottom = `-${clipPx.toFixed(1)}px`;
  }

  // Renders the exact same transform the photo goes through (filter, then the
  // weather tint blended on top) onto a single pixel of the scene's own paper
  // color, and reads back what that pixel actually becomes. This is the only way
  // to keep the page background matching the photo's edge: guessing a "night
  // color" independently of the photo's own filter/tint math is what caused the
  // page and the photo to visibly mismatch (a photo-on-a-different-background
  // look) in every state except plain daylight.
  const colorCanvas = document.createElement('canvas');
  colorCanvas.width = 1; colorCanvas.height = 1;
  const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });
  function renderedPaper(paperHex, brightness, saturation, tintColor, tintOpacity, tintBlend) {
    colorCtx.clearRect(0, 0, 1, 1);
    colorCtx.filter = `saturate(${(1.08 * saturation).toFixed(4)}) contrast(1.04) brightness(${(1.01 * brightness).toFixed(4)})`;
    colorCtx.fillStyle = paperHex;
    colorCtx.fillRect(0, 0, 1, 1);
    colorCtx.filter = 'none';
    if (tintOpacity > 0) {
      colorCtx.globalAlpha = tintOpacity;
      colorCtx.globalCompositeOperation = tintBlend === 'normal' ? 'source-over' : tintBlend;
      colorCtx.fillStyle = tintColor;
      colorCtx.fillRect(0, 0, 1, 1);
      colorCtx.globalAlpha = 1;
      colorCtx.globalCompositeOperation = 'source-over';
    }
    const d = colorCtx.getImageData(0, 0, 1, 1).data;
    return '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // Applies the scene's live weather/light state (if loaded) to the page: the
  // photo dims/desaturates and takes a color tint for night or golden-hour light,
  // the page background is re-measured to match that exact transform (see
  // renderedPaper above), ink shifts for readability, and rain/snow/fog layers
  // switch on when relevant. If the weather fetch hasn't resolved yet, this
  // quietly does nothing and the page shows the scene's plain baseline "day"
  // look instead of guessing.
  function applyLiveVisuals(scene) {
    const live = scene.live;
    if (!live) {
      root.style.setProperty('--paper', scene.paper);
      root.style.setProperty('--ink', scene.ink);
      root.style.setProperty('--ink-soft', scene.inkSoft);
      root.style.setProperty('--b', 1);
      root.style.setProperty('--s', 1);
      tintEl.style.setProperty('--tint-opacity', 0);
      fogEl.classList.remove('active');
      rainEl.classList.remove('active');
      snowEl.classList.remove('active');
      liveLineEl.classList.remove('ready');
      return;
    }
    const now = Date.now();
    const phase = lightPhase(now, live.sunriseMs, live.sunsetMs);
    const cloudFactor = Math.min(1, live.cloudCover / 100);

    let ink = scene.ink, inkSoft = scene.inkSoft;
    let brightness = 1, saturation = 1 - cloudFactor * 0.18;
    let tintColor = 'transparent', tintOpacity = 0, tintBlend = 'normal';

    if (phase === 'night') {
      const depth = 0.78;
      ink = lerpHex(scene.ink, NIGHT_INK, depth);
      inkSoft = lerpHex(scene.inkSoft, NIGHT_INK_SOFT, depth);
      brightness = 0.7; saturation *= 0.68;
      tintColor = '#141a30'; tintOpacity = 0.32; tintBlend = 'multiply';
    } else if (phase === 'dawn' || phase === 'dusk') {
      brightness = 1.04; saturation *= 1.1;
      tintColor = phase === 'dawn' ? '#ffb168' : '#ff8f6b';
      tintOpacity = 0.16; tintBlend = 'soft-light';
    }

    const paper = renderedPaper(scene.paper, brightness, saturation, tintColor, tintOpacity, tintBlend);
    root.style.setProperty('--paper', paper);
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--ink-soft', inkSoft);
    root.style.setProperty('--b', brightness.toFixed(3));
    root.style.setProperty('--s', Math.max(0.4, saturation).toFixed(3));
    tintEl.style.setProperty('--tint-color', tintColor);
    tintEl.style.setProperty('--tint-opacity', tintOpacity);
    tintEl.style.setProperty('--tint-blend', tintBlend);

    fogEl.classList.toggle('active', live.kind === 'fog');
    rainEl.classList.toggle('active', live.kind === 'rain' || live.kind === 'storm');
    snowEl.classList.toggle('active', live.kind === 'snow');

    const fmt = new Intl.DateTimeFormat('en-US', { timeZone: scene.tz, hour: 'numeric', minute: '2-digit' });
    const phraseText = weatherPhrase(live.kind, live.isDay, live.cloudCover);
    liveTextEl.textContent = `${fmt.format(now)} in ${scene.city} · ${Math.round(live.temp)}°C · ${phraseText}`;
    liveLineEl.classList.add('ready');
  }

  function renderScene(scene) {
    eyebrowEl.textContent = scene.label;
    titleEl.textContent = scene.title;
    subtitleEl.textContent = scene.subtitle;
    liveTextEl.textContent = `reading the sky over ${scene.city}…`;
    liveLineEl.classList.remove('ready');

    root.style.setProperty('--cx', scene.cx + '%');
    root.style.setProperty('--cy', scene.cy + '%');

    imgEl.style.clipPath = 'inset(0)';
    imgEl.style.marginBottom = '0';

    const finish = () => {
      requestAnimationFrame(() => requestAnimationFrame(() => closeGap(imgEl)));
      applyLiveVisuals(scene);
    };
    imgEl.onload = finish;
    imgEl.src = scene.src;
    if (imgEl.complete && imgEl.src.endsWith(scene.src)) finish();

    [...switcherEl.children].forEach((btn, i) => btn.classList.toggle('active', i === sceneIndex));
  }

  function goTo(i) {
    if (i === sceneIndex) return;
    stageEl.classList.add('transitioning');
    setTimeout(() => {
      sceneIndex = i;
      renderScene(SCENES[sceneIndex]);
      stageEl.classList.remove('transitioning');
    }, 240);
  }

  function weatherIconSvg(kind, isDay) {
    if (kind === 'clear') return isDay
      ? '<circle cx="12" cy="12" r="4.2"/>'
      : '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>';
    if (kind === 'fog') return '<path d="M4 10h16M4 14h16M4 18h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    if (kind === 'rain' || kind === 'storm') return '<path d="M7 15a5 5 0 0 1 .3-9.96A6 6 0 0 1 18.9 8.1 4.5 4.5 0 0 1 18 17H7z" /><path d="M9 19l-1.2 2.2M13 19l-1.2 2.2M17 19l-1.2 2.2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    if (kind === 'snow') return '<path d="M7 15a5 5 0 0 1 .3-9.96A6 6 0 0 1 18.9 8.1 4.5 4.5 0 0 1 18 17H7z"/><circle cx="9" cy="20" r="0.9" fill="currentColor" stroke="none"/><circle cx="13" cy="21" r="0.9" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="0.9" fill="currentColor" stroke="none"/>';
    return '<path d="M7 15a5 5 0 0 1 .3-9.96A6 6 0 0 1 18.9 8.1 4.5 4.5 0 0 1 18 17H7z"/>';
  }

  SCENES.forEach((scene, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    const label = document.createElement('span');
    label.textContent = scene.label;
    const time = document.createElement('span');
    time.className = 'tab-time';
    btn.appendChild(label);
    btn.appendChild(time);
    btn.addEventListener('click', () => goTo(i));
    switcherEl.appendChild(btn);
    tabTimeEls.push(time);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') goTo((sceneIndex - 1 + SCENES.length) % SCENES.length);
    if (e.key === 'ArrowRight') goTo((sceneIndex + 1) % SCENES.length);
  });

  function tickClocks() {
    const now = new Date();
    SCENES.forEach((scene, i) => {
      const fmt = new Intl.DateTimeFormat('en-US', { timeZone: scene.tz, hour: 'numeric', minute: '2-digit' });
      const timeStr = fmt.format(now);
      const el = tabTimeEls[i];
      const live = scene.live;
      if (live) {
        const svg = weatherIconSvg(live.kind, live.isDay);
        el.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${svg}</svg>${timeStr}`;
      } else {
        el.textContent = timeStr;
      }
    });
    if (SCENES[sceneIndex].live) applyLiveVisuals(SCENES[sceneIndex]);
  }

  async function fetchWeather() {
    const lats = SCENES.map(s => s.lat).join(',');
    const lons = SCENES.map(s => s.lon).join(',');
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,cloud_cover,is_day,precipitation&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      const list = Array.isArray(data) ? data : [data];
      list.forEach((entry, i) => {
        const scene = SCENES[i];
        if (!scene || !entry || !entry.current) return;
        const offset = entry.utc_offset_seconds || 0;
        scene.live = {
          temp: entry.current.temperature_2m,
          kind: weatherKind(entry.current.weather_code),
          isDay: entry.current.is_day === 1,
          cloudCover: entry.current.cloud_cover,
          sunriseMs: isoLocalToUTCms(entry.daily.sunrise[0], offset),
          sunsetMs: isoLocalToUTCms(entry.daily.sunset[0], offset),
        };
      });
      tickClocks();
      applyLiveVisuals(SCENES[sceneIndex]);
    } catch (e) {
      // offline or blocked: the page still works, it just stays in its baseline look
    }
  }

  renderScene(SCENES[sceneIndex]);
  tickClocks();
  setInterval(tickClocks, 20000);
  fetchWeather();
  setInterval(fetchWeather, 10 * 60 * 1000);
</script>
</body>
</html>
